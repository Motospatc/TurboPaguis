<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboPaguis</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:url("LOGO.jpg") no-repeat center center;
background-size:cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
}

.panel{
position:relative;
z-index:10;
text-align:center;
color:white;
padding:25px;
}

.loader{
width:70px;
height:70px;
border:8px solid rgba(255,255,255,.25);
border-top:8px solid #00ff66;
border-radius:50%;
animation:girar .8s linear infinite;
margin:auto;
}

@keyframes girar{
100%{transform:rotate(360deg);}
}

.check{
display:none;
font-size:95px;
animation:aparece .5s ease;
}

@keyframes aparece{
0%{transform:scale(.2);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

h1{
margin-top:20px;
font-size:30px;
}

p{
margin-top:15px;
font-size:20px;
}

button{
display:none;
margin-top:30px;
padding:16px 30px;
font-size:20px;
background:#16a34a;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="panel">

<div class="loader" id="loader"></div>

<div class="check" id="check"></div>

<h1 id="titulo">Copiando...</h1>

<p id="mensaje">
Espera un momento...
</p>

<button id="boton" onclick="copiar()">
 Copiar número
</button>

</div>

<script>

const numero="4152 3143 6877 6707";

async function copiar(){

try{

await navigator.clipboard.writeText(numero);

setTimeout(function(){

document.getElementById("loader").style.display="none";

document.getElementById("check").style.display="block";

document.getElementById("titulo").innerHTML="¡Listo!";

document.getElementById("mensaje").innerHTML="Número copiado correctamente.<br><br>Ahora abre tu aplicación bancaria y pégalo.";

},1200);

}catch{

document.getElementById("loader").style.display="none";

document.getElementById("check").style.display="block";

document.getElementById("titulo").innerHTML="No fue posible copiar automáticamente";

document.getElementById("mensaje").innerHTML="Presiona el botón para copiar el número.";

document.getElementById("boton").style.display="inline-block";

}

}

window.onload=function(){

setTimeout(copiar,300);

};

</script>

</body>
</html>
